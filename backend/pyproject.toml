[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "translator-platform"
version = "0.1.0"
description = "AI-Powered Multilingual Communication Platform"
readme = "README.md"
authors = [{name = "Translator Platform Team"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "pydantic-extra-types==2.4.0",
    "sqlalchemy==2.0.25",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "redis==5.0.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.6",
    "email-validator==2.1.0.post1",
    "httpx==0.26.0",
    "aiohttp==3.9.1",
    "pandas==2.1.4",
    "numpy==1.26.3",
    "pyyaml==6.0.1",
    "csvkit==1.0.7",
    "torch==2.1.2",
    "transformers==4.36.2",
    "accelerate==0.25.0",
    "sentencepiece==0.2.0",
    "tokenizers==0.15.1",
    "faster-whisper==1.0.3",
    "ctranslate2==4.3.0",
    "ahocorasick==2.1.1",
    "structlog==24.1.0",
    "python-json-logger==2.0.7",
    "python-dotenv==1.0.0",
    "click==8.1.7",
    "tqdm==4.66.1",
    "orjson==3.9.10",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "faker==22.0.0",
    "locust==2.17.0",
    "mypy==1.7.1",
    "types-redis==4.6.0.20231010",
    "black==23.12.1",
    "isort==5.13.2",
    "ruff==0.1.15",
    "pre-commit==3.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ai_engine*", "inference*", "datasets*"]
exclude = ["tests*", "*.egg-info"]