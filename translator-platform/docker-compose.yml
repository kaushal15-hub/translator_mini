version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: translator-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-translator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-translator}
      POSTGRES_DB: ${POSTGRES_DB:-translator_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-translator} -d ${POSTGRES_DB:-translator_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - translator-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: translator-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - translator-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: translator-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-translator}:${POSTGRES_PASSWORD:-translator}@postgres:5432/${POSTGRES_DB:-translator_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production-min-32-chars}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - BCRYPT_ROUNDS=12
      - BACKEND_CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - MODEL_CACHE_DIR=/app/models
      - INDIC_TRANS2_MODEL_PATH=/app/models/indictrans2
      - WHISPER_MODEL_PATH=/app/models/whisper
      - MODEL_DEVICE=cpu
      - INFERENCE_BATCH_SIZE=1
      - MAX_SEQ_LENGTH=512
      - ENABLE_INT8_QUANTIZATION=true
      - CPU_THREADS=4
      - MAX_CONCURRENT_INFERENCE=4
      - INFERENCE_TIMEOUT=30
      - INFERENCE_QUEUE_MAX_SIZE=100
      - TRANSLATION_CACHE_TTL=3600
      - GLOSSARY_CACHE_TTL=7200
      - SESSION_CACHE_TTL=1800
      - WS_PING_INTERVAL=30
      - WS_PING_TIMEOUT=10
      - WS_MAX_MESSAGE_SIZE=1048576
      - RATE_LIMIT_REQUESTS=60
      - RATE_LIMIT_WINDOW=60
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - INIT_ADMIN_EMAIL=${INIT_ADMIN_EMAIL:-admin@translator.local}
      - INIT_ADMIN_PASSWORD=${INIT_ADMIN_PASSWORD:-change-me-immediately}
      - INIT_ADMIN_FULL_NAME=${INIT_ADMIN_FULL_NAME:-System Administrator}
      - DEFAULT_DOMAINS=technology,medical,general
      - SUPPORTED_LANGUAGES=en,kn,hi,ml,ta
      - DEFAULT_SOURCE_LANG=en
      - DEFAULT_TARGET_LANG=kn
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
      - translator_models:/app/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - translator-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: translator-frontend
    environment:
      - VITE_API_URL=http://backend:8000
      - VITE_WS_URL=ws://backend:8000
      - VITE_APP_TITLE=Translator Platform
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - translator-network

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: translator-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - translator-network
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  translator_models:

networks:
  translator-network:
    driver: bridge